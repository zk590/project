[package]
name = "sha2"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = { git = "https://github.com/ziren-patches/RustCrypto-hashes", package = "sha2", branch = "patch-sha2-0.10.8" }
clap = { version = "4.4.8", features = ["derive"] }
hex = "0.4.3"
rkyv = { version = "0.7.45", features = ["std", "validation", "alloc"] }
rkyv_derive = { version = "0.7.45" }
common = {path="../common"}


[[bin]]
name = "sha2_batch"
path = "src/main_batch.rs"