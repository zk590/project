[package]
name = "keccak"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "keccak"
path = "src/main.rs"

[[bin]]
name = "keccak_batch"
path = "src/main_batch.rs"

[dependencies]
rkyv = { version = "0.7.45", features = ["std", "validation", "alloc"] }
rkyv_derive = { version = "0.7.45" }
common = {path="../common"}
zkm-zkvm = { git = "https://github.com/zkMIPS/zkMIPS.git" }
clap = { version = "4.4.8", features = ["derive"] }
hex = "0.4.3"
tiny-keccak = { version = "2.0", features = ["keccak"] }