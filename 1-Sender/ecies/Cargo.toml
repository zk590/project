[package]
name = "ecies"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ecies"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
k256 = { git = "https://github.com/ziren-patches/elliptic-curves", branch = "patch-k256-0.13.4",default-features = false}
secp256k1 = { git = "https://github.com/ziren-patches/rust-secp256k1", branch = "patch-0.29.1" }
sha2-v0-10-8 = { git = "https://github.com/ziren-patches/RustCrypto-hashes", package = "sha2", branch = "patch-sha2-0.10.8" }
rand_core = { version = "0.9", optional = true }
thiserror = "1.0.40"
aes-gcm = "=0.11.0-rc.0"
hkdf = "0.12"
hex = "0.4.3"
rand = "0.9"

[dev-dependencies]
rand = "0.9"

[features]
default = ["rand"]
rand = ["dep:rand_core"]