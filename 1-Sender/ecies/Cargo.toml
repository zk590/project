[package]
name = "ecies"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ecies"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-5.0.0" }
secp256k1 = { git = "https://github.com/sp1-patches/rust-secp256k1", tag = "patch-0.29.1-sp1-5.0.0" }
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-4.0.0" }
rand_core = { version = "0.9", optional = true }
thiserror = "1.0.40"
aes-gcm = "=0.11.0-rc.0"
hkdf = "0.12"
hex = "0.4.3"
rand = "0.9"

[dev-dependencies]
rand = "0.9"

[features]
default = ["rand"]
rand = ["dep:rand_core"]