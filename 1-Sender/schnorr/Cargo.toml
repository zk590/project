[package]
name = "schnorr"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "schnorr"
path = "src/main.rs"

[[bin]]
name = "schnorr_batch"
path = "src/main_batch.rs"

[dependencies]
k256 = { git = "https://github.com/ziren-patches/elliptic-curves", branch = "patch-k256-0.13.4",default-features = false, features = ["ecdsa", "alloc", "schnorr"] }
ecdsa = { git = "https://github.com/ziren-patches/signatures", package = "ecdsa", branch = "patch-ecdsa-0.16.9", features = ["verifying"] }
clap = { version = "4.4.8", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rkyv = { version = "0.7.44", features = ["std", "alloc", "validation"] }
common = {path="../common"}
rand = "0.8.5"