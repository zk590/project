[package]
name = "keccak-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-sol-types = { workspace = true }

# 添加host特性相关的依赖
zkm-sdk = { workspace = true, optional = true }
bincode = { version = "1.3.3", optional = true }
serde = { workspace = true, optional = true }
rkyv = { version = "0.7.45", features = ["std", "validation", "alloc"], optional = true }

[features]
host = ["dep:zkm-sdk", "dep:bincode", "dep:serde", "dep:rkyv"]