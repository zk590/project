[package]
name = "coset-host"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
alloy-sol-types = { workspace = true }
alloy-primitives.workspace = true
clap = { workspace = true }
dotenv = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
coset-lib = { path = "../lib" }
coset-bls12_381.workspace = true
coset-poseidon.workspace = true
coset-bytes.workspace = true
plonk.workspace = true
poseidon-merkle.workspace = true
rand = "0.8.5"
rkyv = { version = "0.7.45", features = ["std", "validation", "alloc"] }
zkm-sdk = { workspace = true }

[build-dependencies]
zkm-build = { workspace = true }

[[bin]]
name = "coset"
path = "src/main.rs"

[[bin]]
name = "evm"
path = "bin/evm.rs"

[[bin]]
name = "vkey"
path = "bin/vkey.rs"