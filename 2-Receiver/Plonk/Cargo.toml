[package]
name = "Plonk"
version = "0.1.0"
edition = "2024"

[lib]
name = "receiver_plonk"
crate-type = ["rlib", "staticlib"]

[dependencies]
bincode = "1.3.3"
plonk = {path = "../../3-Plonk/plonk"}
coset-bls12_381 = { path = "../../3-Plonk/coset-bls12_381", features = ["serde"] }
coset-bytes = { path = "../../3-Plonk/coset-bytes/bytes" }
poseidon-merkle = {path = "../../3-Plonk/poseidon-merkle"}
rkyv = { version = "0.7.45", features = ["std", "validation", "alloc"] }
common = { path = "../../1-Sender/common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
